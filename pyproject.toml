# ebookerr-plugins: the first-party ebookerr plugins and the default plugin registry.
# Not an installable package (no [build-system]): this file configures the checks CI runs on every
# plugin, and the tracked uv.lock pins every tool and requirement they run with.
# Install them with `uv sync` (CI: `uv sync --frozen`); run every check with
# `uv run python scripts/check.py` (what CI runs).

[project]
# The Python floor uv resolves the lock for: the core's own requires-python (the core's
# tests/unit/test_toolchain_pins.py keeps the two equal).
name = "ebookerr-plugins"
version = "0"
requires-python = ">=3.11.5"
dependencies = []

[dependency-groups]
dev = [
    "ebookerr-sdk[text,generation]==3.13.0",  # the SDK every plugin runs on
    # the plugins' own runtime requirements (each manifest.toml `requirements`); a `==` pin is
    # tracked by scripts/requirement_pins.py (plan/apply) and must equal every manifest's (its check)
    "fanficfare==4.63.0",
    "pymupdf==2.1",
    "python-docx==1.2.0",
    "striprtf==0.0.35",
    "charset-normalizer>=3.3",
    # tests, lint and type checks
    "pytest>=8.0",
    "responses>=0.25",
    "reportlab>=4.0",
    "ruff>=0.17.4",
    "mypy>=1.10",
    "check-jsonschema>=0.39",  # scripts/check.py validates the workflows and dependabot.yml against SchemaStore's schemas
    "packaging>=24",  # scripts/requirement_pins.py parses requirements
    "types-requests",
    "types-defusedxml",
    "uv>=0.12.18",  # the uv CI runs: setup-uv reads its version from uv.lock (Dependabot bumps it)
]

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "--strict-markers -m 'not e2e'"
markers = [
    "e2e: opt-in end-to-end tests that need the network (run with: python -m pytest -m e2e)",
    "pins: declares the ledger finding(s) this test pins, e.g. @pytest.mark.pins(\"EXP-138\") (EXP-161)",
    "real_impl(symbol): drives the real first-party implementation a sibling pins test stubs (EXP-240)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B", "S", "T20", "PTH", "SIM", "C90", "DTZ", "PT", "D"]
ignore = ["S603", "S607"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"*/tests/**" = ["S101", "S104", "S105", "S106", "S310", "S314", "DTZ", "D"]
"tests/**" = ["S101", "S104", "S105", "S106", "S310", "S314", "DTZ", "D"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["."]
exclude = ['/tests/', '^tests/', '/entrypoint\.py$', '^conftest\.py$', '^\.venv/']
explicit_package_bases = true
mypy_path = [
    "plugins/epub/epub_normalize",
    "plugins/epub/epub_chapter_reorder", "plugins/epub/epub_merge",
    "plugins/source/epub_download_source", "plugins/source/pdf_download_source",
    "plugins/source/docx_download_source", "plugins/source/text_download_source",
    "plugins/source/rtf_download_source", "plugins/source/fanficfare_source",
    "plugins/book/llm_synopsis", "plugins/book/llm_cover", "plugins/book/kavita_sync",
    "plugins/book/komga_sync", "plugins/catalog/url_story_extractor",
    "plugins/book/file_meta_sync",
    "plugins/catalog/literotica_stories",
    "plugins/catalog/my_literotica",
    "plugins/catalog/patreon_stories",
]

[[tool.mypy.overrides]]
module = ["pymupdf", "docx", "striprtf.*", "tinycss2.*", "fanficfare", "fanficfare.*", "html5lib.*"]
ignore_missing_imports = true
