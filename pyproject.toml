# ebookerr-plugins: the first-party ebookerr plugins and the default plugin registry.
# Not an installable project: this file configures the checks CI runs on every plugin.
# Install the tools with `python -m pip install --group dev` (pip 25.1 or later).
# Run every check with `python scripts/check.py` (what CI runs).

[dependency-groups]
dev = [
    "ebookerr-sdk[text,generation]==2.30.0",  # the SDK every plugin runs on
    # the plugins' own runtime requirements (each manifest.toml `requirements`)
    "fanficfare>=4.58.1",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "striprtf>=0.0.26",
    "charset-normalizer>=3.3",
    # tests, lint and type checks
    "pytest>=8.0",
    "responses>=0.25",
    "reportlab>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-requests",
    "types-defusedxml",
]

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "--strict-markers -m 'not e2e'"
markers = [
    "e2e: opt-in end-to-end tests that need the network (run with: python -m pytest -m e2e)",
    "pins: declares the ledger finding(s) this test pins, e.g. @pytest.mark.pins(\"EXP-138\") (EXP-161)",
    "real_impl(symbol): drives the real first-party implementation a sibling pins test stubs (EXP-240)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B", "S", "T20", "PTH", "SIM", "C90", "DTZ", "PT", "D"]
ignore = ["S603", "S607"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"*/tests/**" = ["S101", "S104", "S105", "S106", "S310", "S314", "DTZ", "D"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["."]
exclude = ['/tests/', '/entrypoint\.py$', '^conftest\.py$', '^\.venv/']
explicit_package_bases = true
mypy_path = [
    "plugins/epub/epub_chapter_url", "plugins/epub/epub_normalize", "plugins/epub/epub_validate",
    "plugins/epub/epub_chapter_reorder", "plugins/epub/epub_merge",
    "plugins/source/epub_download_source", "plugins/source/pdf_download_source",
    "plugins/source/docx_download_source", "plugins/source/text_download_source",
    "plugins/source/rtf_download_source", "plugins/source/fanficfare_source",
    "plugins/book/llm_synopsis", "plugins/book/llm_cover", "plugins/book/kavita_sync",
    "plugins/book/komga_sync", "plugins/catalog/url_story_extractor",
]

[[tool.mypy.overrides]]
module = ["pymupdf", "docx", "striprtf.*", "tinycss2.*", "fanficfare", "fanficfare.*"]
ignore_missing_imports = true

# ebookerr-sdk 2.30.0 ships without a PEP 561 py.typed marker, so mypy would skip it as untyped.
# Follow it anyway (full type checking of every SDK call); drop this once the SDK ships py.typed.
[[tool.mypy.overrides]]
module = ["ebookerr_sdk", "ebookerr_sdk.*"]
follow_untyped_imports = true
