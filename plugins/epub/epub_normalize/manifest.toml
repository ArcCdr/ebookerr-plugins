id = "epub_normalize"
name = "EPUB Normalize"
version = "2.0.2"
type = "epub"
spi_version = "3.1"
description = "Strip publisher styling that stops your reader applying its own fonts, colours, sizes, spacing and margins."
priority = 70
events = ["EpubCreated", "EpubModified"]
run_timeout_s = 600
icon = "format_paint"
author = "ArcCdr"
license = "MIT"
homepage = "https://github.com/ArcCdr/ebookerr-plugins/tree/main/epub_normalize"
source = "https://github.com/ArcCdr/ebookerr-plugins/tree/main/epub_normalize"
issues = "https://github.com/ArcCdr/ebookerr-plugins/issues"
entrypoint = "entrypoint.py"

[settings_schema]
summary = "Styling removed: {level}"

[[settings_schema.fields]]
key = "level"
type = "string"
label = "Styling to remove"
default = "standard"
options = ["light", "standard", "strict"]
options_strict = true
option_labels = ["Colours and fonts only", "Everything your reader can set", "Everything but headings and emphasis"]
help = """Colours and fonts only: removes the book's own text and background colours and its fonts, and deletes the embedded font files nothing uses any more, so a dark theme and your chosen font work. Sizes, spacing and layout stay as published.
Everything your reader can set: also hands text size, line and letter spacing, justification, hyphenation and page margins to your reader. Body text takes your reader's size and headings stay proportionally larger; fixed widths, heights, margins and indents become sizes that reflow to fit your screen.
Everything but headings and emphasis: also removes every other text size and the styling of drop caps, keeping only headings, bold, italic and the paragraphs themselves.
At every level, paragraphs, line breaks and blank lines stay, images, covers, SVG and maths are left alone, and fixed-layout or DRM-protected books are never changed. Choosing a lower level later does not bring back what was removed."""

[[ui_triggers]]
scope = "book_selection_action"
label = "Normalize styling"
description = "Remove hardcoded book styling that may interfere with your reader's font, theme and text size."
