name: dependency-release

# When CI passes on a bot pull request deps/<package>, merge exactly the commit CI tested, then tag
# every plugin whose version the merge changed. The tags start release.yml. Tags pushed with the
# App's token start workflows; tags pushed with GITHUB_TOKEN would not.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: dependency-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'deps/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the bot is configured
        env:
          APP_ID: ${{ vars.DEPS_BOT_APP_ID }}
          HAS_KEY: ${{ secrets.DEPS_BOT_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$APP_ID" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::error::Set the DEPS_BOT_APP_ID variable and the DEPS_BOT_PRIVATE_KEY secret (see docs/RELEASE.md in the core repository)."
            exit 1
          fi
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ vars.DEPS_BOT_APP_ID }}
          private-key: ${{ secrets.DEPS_BOT_PRIVATE_KEY }}
      - name: Merge the tested pull request
        id: merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          pr="$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
            --json number,author,labels,headRefOid --jq '.[0] // empty')"
          if [ -z "$pr" ]; then echo "No open pull request for ${BRANCH}"; exit 0; fi
          number="$(jq -r .number <<<"$pr")"
          author="$(jq -r .author.login <<<"$pr")"
          head="$(jq -r .headRefOid <<<"$pr")"
          labelled="$(jq -r '[.labels[].name] | index("dependency-release") != null' <<<"$pr")"
          if [ "$author" != "app/${SLUG}" ] || [ "$labelled" != "true" ] || [ "$head" != "$HEAD_SHA" ]; then
            echo "Pull request #${number} is not the bot's tested head (author ${author}, label ${labelled}, head ${head}): not merged"
            exit 0
          fi
          gh pr merge "$number" -R "$GITHUB_REPOSITORY" --squash --match-head-commit "$HEAD_SHA" --delete-branch
          commit="$(gh pr view "$number" -R "$GITHUB_REPOSITORY" --json mergeCommit --jq .mergeCommit.oid)"
          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.merge.outputs.merged == 'true'
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - name: Tag the released plugins
        if: steps.merge.outputs.merged == 'true'
        env:
          COMMIT: ${{ steps.merge.outputs.commit }}
        run: |
          set -euo pipefail
          # The squash commit itself, never main's HEAD: another commit may have landed since.
          for manifest in $(git diff --name-only "${COMMIT}~1" "$COMMIT" -- 'plugins/*/*/manifest.toml'); do
            id="$(basename "$(dirname "$manifest")")"
            version="$(git show "${COMMIT}:${manifest}" | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1)"
            tag="${id}-${version}"
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
              echo "${tag} already exists"
              continue
            fi
            git tag "$tag" "$COMMIT"
            git push origin "refs/tags/${tag}"
            echo "Tagged ${tag}"
          done
