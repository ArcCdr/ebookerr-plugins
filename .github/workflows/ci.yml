name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # uv at the version uv.lock pins, Python at .python-version: one source each.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: uv.lock
      - name: Lock is current
        run: uv lock --check
      - name: Environment from the lock
        run: uv sync --frozen
      # scripts/check.py is the single definition of the repository's checks (lint, format,
      # types, then per plugin its pack check and tests, then tests/): the ebookerr core runs
      # the same file, so a new check goes there, never here.
      - name: Check the repository
        run: uv run --no-sync python scripts/check.py
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      # Last, so every check above reports even when a new advisory reddens the run.
      - name: Vulnerable dependencies
        run: uv run --no-sync python scripts/vuln_scan.py --manifests uv.lock
