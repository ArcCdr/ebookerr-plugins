name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
      # scripts/check.py is the single definition of the repository's checks (lint, format,
      # types, then per plugin its pack check and tests, then tests/): the ebookerr core runs
      # the same file, so a new check goes there, never here.
      - name: Check the repository
        run: python scripts/check.py
