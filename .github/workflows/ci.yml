name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install the tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
      # scripts/check.py is the single definition of the repository's checks (lint, format,
      # types, then per plugin its pack check and tests, then tests/): the ebookerr core runs
      # the same file, so a new check goes there, never here.
      - name: Check the repository
        run: python scripts/check.py
