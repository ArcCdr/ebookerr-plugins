name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install the tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
      - name: Lint and type-check
        run: |
          ruff check .
          ruff format --check .
          mypy
      - name: Check and test every plugin
        run: |
          set -euo pipefail
          for manifest in plugins/*/*/manifest.toml; do
            plugin="$(dirname "$manifest")"
            echo "::group::$plugin"
            python -m ebookerr_sdk.pack check "$plugin"
            if [ -d "$plugin/tests" ]; then
              python -m pytest "$plugin/tests" || [ "$?" -eq 5 ]
            fi
            echo "::endgroup::"
          done
