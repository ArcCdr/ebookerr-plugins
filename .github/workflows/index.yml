name: index

# Rebuild the registry index and the plugin list from every release, commit them to main when they
# changed (site/index.json, site/README.md, README.md), then ask the pages workflow to publish that
# commit. The index is stamped with the newest release's date, so an unchanged catalogue rebuilds
# byte for byte and commits nothing. Runs after every release, on a registry.toml change, or by hand.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["registry/**"]

permissions:
  contents: write
  actions: write

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install the SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ebookerr-sdk==2.30.0"
      - name: Download every released package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p packages
          gh release list --limit 1000 --json tagName,publishedAt > releases.json
          python -c "import json; rows = json.load(open('releases.json', encoding='utf-8')); json.dump({r['tagName']: r['publishedAt'] for r in rows}, open('published.json', 'w', encoding='utf-8'))"
          for tag in $(python -c "import json; print(' '.join(json.load(open('published.json', encoding='utf-8'))))"); do
            gh release download "$tag" --pattern "$tag.zip" --dir packages
          done
      - name: Build the index
        run: |
          set -euo pipefail
          now="$(python -c "import json; print(max(json.load(open('published.json', encoding='utf-8')).values()))")"
          python -m ebookerr_sdk.pack index registry --packages packages --published published.json --now "$now" --out site
          cp site/README.md README.md
      - name: Commit the index and the plugin list
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md site/index.json site/README.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "docs: regenerate the registry index and the plugin list"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the new index
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
