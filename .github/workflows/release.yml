name: release

# A tag <id>-<version> releases one plugin: check it, build its package, attach the package to a
# GitHub release, then ask the index workflow to rebuild the registry index from every release.
# This workflow never deploys GitHub Pages itself: a Pages deployment is keyed on the commit a run
# was triggered for, and several tags on one commit would all ask for the same deployment.

on:
  push:
    tags: ["*-[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the tools
        # The same environment ci.yml checks in: the SDK at its pin and every plugin's own
        # requirements, so pack check resolves each requirement's import names exactly as it did on
        # main (a release job with the SDK alone failed DOCX 1.2.0 and 1.3.0).
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
      - name: Check, build and publish the tagged plugin
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          plugin="${TAG%-*}"
          shopt -s nullglob
          folders=(plugins/*/"$plugin")
          if [ "${#folders[@]}" -ne 1 ]; then
            echo "The tag $TAG names no single plugin folder plugins/<type>/$plugin." >&2
            exit 1
          fi
          folder="${folders[0]}"
          python -m ebookerr_sdk.pack check "$folder"
          python -m ebookerr_sdk.pack build "$folder" --out dist
          if [ ! -f "dist/$TAG.zip" ]; then
            echo "The tag $TAG does not match the version in $folder/manifest.toml." >&2
            exit 1
          fi
          gh release create "$TAG" "dist/$TAG.zip" --title "$TAG" \
            --notes "What's new is in $folder/CHANGELOG.txt and in the ebookerr plugin catalogue."
      - name: Rebuild the registry index
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run index.yml --ref main
