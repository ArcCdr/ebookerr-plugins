name: release

on:
  push:
    tags: ["*-[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install the SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ebookerr-sdk==2.30.0"
      - name: Check, build and publish the tagged plugin
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          plugin="${TAG%-*}"
          python -m ebookerr_sdk.pack check "$plugin"
          python -m ebookerr_sdk.pack build "$plugin" --out dist
          if [ ! -f "dist/$TAG.zip" ]; then
            echo "The tag $TAG does not match the version in $plugin/manifest.toml." >&2
            exit 1
          fi
          gh release create "$TAG" "dist/$TAG.zip" --title "$TAG" \
            --notes "What's new is in $plugin/CHANGELOG.txt and in the ebookerr plugin catalogue."

  pages:
    needs: release
    if: ${{ always() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install the SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ebookerr-sdk==2.30.0"
      - name: Download every released package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p packages
          gh release list --limit 1000 --json tagName,publishedAt > releases.json
          python -c "import json; rows = json.load(open('releases.json', encoding='utf-8')); json.dump({r['tagName']: r['publishedAt'] for r in rows}, open('published.json', 'w', encoding='utf-8'))"
          for tag in $(python -c "import json; print(' '.join(json.load(open('published.json', encoding='utf-8'))))"); do
            gh release download "$tag" --pattern "$tag.zip" --dir packages
          done
      - name: Build the index
        run: python -m ebookerr_sdk.pack index registry --packages packages --published published.json --out site
      - name: Commit the plugin list
        run: |
          cp site/README.md README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: regenerate the plugin list"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
